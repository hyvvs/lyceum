name: Desktop native smoke

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.94.0"
      LYCEUM_RUN_KEYCHAIN_TESTS: "1"
      LYCEUM_KEEP_ACL_PROBE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install pinned stable Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Create synthetic isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lyceum-test.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - name: Build the actual web assets used by the desktop shell
        run: pnpm web:build
      - name: Enforce native Rust formatting
        run: cargo +1.94.0 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Native backend tests (including fail-closed URL and key-ID checks)
        run: cargo +1.94.0 test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Verify Windows app-data DACL inherits a private profile ACL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:APPDATA "lyceum-m0-005-acl-probe-$env:GITHUB_RUN_ID"
          try {
            if (!(Test-Path -LiteralPath $path -PathType Container)) { throw "ACL probe directory missing" }
            $acl = Get-Acl -LiteralPath $path
            $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            $ownerSid = $acl.GetOwner([System.Security.Principal.SecurityIdentifier])
            $adminsSid = [System.Security.Principal.SecurityIdentifier]::new(
              [System.Security.Principal.WellKnownSidType]::BuiltinAdministratorsSid, $null
            )
            $ownerIsCurrentUser = $ownerSid.Value -eq $currentSid.Value
            $ownerIsAdministrators = $ownerSid.Value -eq $adminsSid.Value
            "windowsAppDataOwnerCheck ownerIsCurrentUser=$ownerIsCurrentUser ownerIsAdministrators=$ownerIsAdministrators"
            if (!$ownerIsCurrentUser -and !$ownerIsAdministrators) { throw "App-data directory owner is neither current user nor trusted local administrators" }
            # Reject common machine-wide/logon groups, not only localized account names.
            $broadPrincipalSids = @(
              'S-1-1-0',       # Everyone
              'S-1-2-0',       # Local
              'S-1-5-2',       # Network
              'S-1-5-4',       # Interactive
              'S-1-5-6',       # Service
              'S-1-5-7',       # Anonymous Logon
              'S-1-5-11',      # Authenticated Users
              'S-1-5-32-545',  # BUILTIN Users
              'S-1-5-32-546',  # BUILTIN Guests
              'S-1-5-32-547',  # BUILTIN Power Users
              'S-1-5-32-548',  # BUILTIN Account Operators
              'S-1-5-32-549',  # BUILTIN Server Operators
              'S-1-5-32-550',  # BUILTIN Print Operators
              'S-1-5-32-551',  # BUILTIN Backup Operators
              'S-1-5-32-552',  # BUILTIN Replicator
              'S-1-5-32-554',  # BUILTIN Pre-Windows 2000 Compatible Access
              'S-1-5-32-555',  # BUILTIN Remote Desktop Users
              'S-1-5-32-558',  # BUILTIN Performance Monitor Users
              'S-1-5-32-559',  # BUILTIN Performance Log Users
              'S-1-5-32-568',  # BUILTIN IIS_IUSRS
              'S-1-5-32-573',  # BUILTIN Event Log Readers
              'S-1-5-32-580',  # BUILTIN Remote Management Users
              'S-1-5-113',     # Local account
              'S-1-5-114',     # Local account and member of Administrators
              'S-1-5-80-0',    # All Services
              'S-1-15-2-1',    # All Application Packages
              'S-1-15-2-2'     # All Restricted Application Packages
            )
            $broad = @($acl.Access | Where-Object {
              $identity = $_.IdentityReference
              $principalSid = if ($identity -is [System.Security.Principal.SecurityIdentifier]) {
                $identity.Value
              } else {
                try {
                  $identity.Translate([System.Security.Principal.SecurityIdentifier]).Value
                } catch {
                  # Windows may not translate AppX package-authority names on every runner.
                  $fallbackSid = switch -Exact ($identity.Value) {
                    'APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES' { 'S-1-15-2-1' }
                    'APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES' { 'S-1-15-2-2' }
                    default { $null }
                  }
                  if (!$fallbackSid) { throw "Unable to resolve app-data ACL principal SID: $($identity.Value)" }
                  $fallbackSid
                }
              }
              $isBroadPrincipal = ($broadPrincipalSids -contains $principalSid) -or
                $principalSid.StartsWith('S-1-15-2-', [System.StringComparison]::Ordinal)
              $_.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
              $isBroadPrincipal -and
              $_.FileSystemRights -ne [System.Security.AccessControl.FileSystemRights]::Synchronize
            })
            if ($broad.Count -gt 0) { throw "Broad principals have app-data access" }
            if ($acl.AreAccessRulesProtected) { throw "App-data directory ACL inheritance is disabled" }
            "windowsAppDataAcl=PASS ownerIsCurrentUser=$ownerIsCurrentUser ownerIsAdministrators=$ownerIsAdministrators broadAccessAceCount=0 inherited=$(!$acl.AreAccessRulesProtected)"
          }
          finally {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
      - name: Reject Rust warnings and Clippy findings
        run: cargo +1.94.0 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Reject warnings in the native-smoke-only Rust feature
        run: cargo +1.94.0 clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --features native-smoke -- -D warnings
      - name: Compile actual desktop application for this native OS
        run: cargo +1.94.0 build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Build native smoke executable with test-only diagnostics
        run: pnpm --filter @lyceum/desktop build:native-smoke
      - name: Assert desktop assets exclude browser PWA service worker
        run: |
          node -e "const fs=require('node:fs'); for (const file of ['apps/web/dist/sw.js','apps/web/dist/manifest.webmanifest']) if (fs.existsSync(file)) throw new Error('Unexpected browser PWA artifact in desktop build: '+file)"
      - name: Launch actual native window and verify renderer IPC/keychain
        run: node apps/desktop/scripts/native-smoke.cjs
      - name: Build ordinary feature-off production executable
        run: pnpm --filter @lyceum/desktop build
      - name: Assert production executable excludes native-smoke controls
        run: |
          node -e "const fs=require('node:fs'); const path=require('node:path'); const file=path.join('apps/desktop/src-tauri/target/release', process.platform==='win32'?'lyceum-desktop.exe':'lyceum-desktop'); const bytes=fs.readFileSync(file); const markers=['LYCEUM_DESKTOP_IPC_SMOKE','LYCEUM_WEBVIEW2_CDP_PORT','LYCEUM_WEBVIEW2_SMOKE_REDIRECT_SOURCE','LYCEUM_REDIRECT_SOURCE_ALLOWED','--remote-debugging-port','LYCEUM_NATIVE_IPC_READY','LYCEUM_NAVIGATION_PROBE_DENIED','LYCEUM_WEB_RESOURCE_PROBE_BLOCKED']; const found=markers.filter(marker=>bytes.includes(Buffer.from(marker))); if(found.length) throw new Error('Production executable contains native-smoke controls: '+found.join(', ')); console.log('productionSmokeFeatureAbsent=PASS')"
      - name: Remove temporary synthetic macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/lyceum-test.keychain-db"
          if test -f "$keychain"; then security delete-keychain "$keychain"; fi

  rust-dependency-policy:
    name: Rust full dependency advisory and license check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust audit toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Install exact Rust audit tools
        run: |
          cargo +1.94.0 install cargo-audit --version 0.23.0 --locked
          cargo +1.94.0 install cargo-deny --version 0.19.9 --locked
      - name: All-target RustSec database audit (no suppressed advisories)
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Complete Rust license, advisories and source gate
        working-directory: apps/desktop/src-tauri
        run: cargo deny check licenses advisories sources
