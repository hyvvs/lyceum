name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install UI browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Test UI keyboard and accessibility
        run: pnpm test:ui
      - name: Build real M0-004 web shell
        run: pnpm web:build
      - name: Assert browser PWA artifacts are present
        run: |
          node -e "const fs=require('node:fs'); for (const file of ['apps/web/dist/sw.js','apps/web/dist/manifest.webmanifest']) if (!fs.existsSync(file)) throw new Error('Missing browser PWA artifact: '+file)"
      - name: Test production web routes, worker and offline PWA
        run: pnpm test:web

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      # These full Rust gates activate whenever desktop Cargo is present in the
      # checked-out revision (including PR #31), alongside desktop-native CI.
      # No dependency audit or security finding is suppressed by this condition.
      - name: Install pinned native Rust audit toolchain
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Install exact Rust supply-chain tools
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: |
          cargo +1.94.0 install cargo-audit --version 0.23.0 --locked
          cargo +1.94.0 install cargo-deny --version 0.19.9 --locked
      - name: Audit the complete Rust lockfile without advisory exceptions
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Fetch all locked target families before offline graph verification
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: cargo +1.94.0 fetch --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Cargo deny full licenses advisories and sources
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        working-directory: apps/desktop/src-tauri
        run: cargo deny check licenses advisories sources
      - name: Fail closed on advisory classification, both RustSec DB revisions, target graphs and expiry
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        run: node scripts/check-native-rust-policy.mjs --check-target-graph

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # CI-only Apache-2.0 tool; no application or runtime dependency.
      - run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0
      - name: Reject suspected credentials
        shell: bash
        run: |
          # Published crates.io SHA-256 checksums and pnpm integrity digests are
          # not credentials. Scan all other content; mask ONLY these structured
          # checksum fields in separately scanned copies, never whole files.
          detect-secrets scan --exclude-files '^pnpm-lock\.yaml$|^docs/design-reference/.*\.jpg$|^scripts/native-rust-policy\.json$|^scripts/fixtures/native-rust-reviewed-ancestry\.json$' > "$RUNNER_TEMP/secrets-report.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          contents = Path("pnpm-lock.yaml").read_text(encoding="utf-8")
          sanitized = re.sub(r"(integrity: sha[0-9]+-)[A-Za-z0-9+/=]+", r"\1redacted", contents)
          (Path(os.environ["RUNNER_TEMP"]) / "lockfile-sanitized.yaml").write_text(sanitized, encoding="utf-8")
          def sanitize_published_checksum(value, filename):
              # Mask ONLY a direct checksum on the reviewed package records;
              # unknown/new nested fields (including ones named checksum)
              # remain visible to the ordinary secret scanner.
              if filename == "scripts/native-rust-policy.json":
                  records = value["allowedMpl"] + value["reviewedIntermediates"] + [value["temporaryAdvisory"]]
              else:
                  records = value
              for record in records:
                  digest = record.get("checksum")
                  if isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest):
                      record["checksum"] = "published-SHA256-redacted"
              return value
          for filename in ("scripts/native-rust-policy.json", "scripts/fixtures/native-rust-reviewed-ancestry.json"):
              source = Path(filename)
              parsed = json.loads(source.read_text(encoding="utf-8"))
              target = Path(os.environ["RUNNER_TEMP"]) / ("sanitized-" + source.name)
              target.write_text(json.dumps(sanitize_published_checksum(parsed, filename), ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          detect-secrets scan --all-files "$RUNNER_TEMP/lockfile-sanitized.yaml" > "$RUNNER_TEMP/lockfile-secrets.json"
          detect-secrets scan --all-files "$RUNNER_TEMP/sanitized-native-rust-policy.json" "$RUNNER_TEMP/sanitized-native-rust-reviewed-ancestry.json" > "$RUNNER_TEMP/rust-policy-secrets.json"
          python -c 'import json,sys; reports=[json.load(open(p)) for p in sys.argv[1:]]; n=sum(len(v) for r in reports for v in r["results"].values()); print(f"{n} suspected secret(s)"); sys.exit(bool(n))' "$RUNNER_TEMP/secrets-report.json" "$RUNNER_TEMP/lockfile-secrets.json" "$RUNNER_TEMP/rust-policy-secrets.json"
