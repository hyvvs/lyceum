# Full lockfile supply-chain policy. Keep all target families in the audit:
# package metadata includes Windows, macOS and any currently unsupported
# platform-specific crates, and unknown licenses must fail rather than vanish.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
