# Full lockfile supply-chain policy. Keep all target families in the audit:
# package metadata includes Windows, macOS and any currently unsupported
# platform-specific crates, and unknown licenses must fail rather than vanish.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
include-dev = true
include-build = true

# Owner-approved exact locked versions only (not a global MPL-2.0 allowance).
# Actual crates.io checksums, source, ancestry and distributed-code obligations
# are independently pinned by scripts/native-rust-policy.json and its guard.
[[licenses.exceptions]]
crate = "cssparser@0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser@0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros@0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short@0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext@0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors@0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors@0.41.0"
allow = ["MPL-2.0"]

[advisories]
# ID-only cargo-deny ignore is constrained by the separate live Windows/macOS
# target graph, checksum, authoritative RustSec classification and expiry guard.
# This is Linux GTK3 unmaintained maintenance risk, never a vulnerability fix.
ignore = [{ id = "RUSTSEC-2024-0370", reason = "Owner: Linux GTK3-only unmaintained proc-macro-error 1.0.4; expires 2027-02-28 UTC; reviewed live target graphs required" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
